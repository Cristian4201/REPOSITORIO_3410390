<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio CSS Interactivo</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121824;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Contenedor gris que agrupa todo */
        .panel {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Filas para ordenar los controles */
        .fila {
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        label {
            font-weight: bold;
        }

        select, input {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #334155;
        }

        /* Área donde se dibuja la caja */
        .zona-previsualizacion {
            background-color: #0f172a;
            height: 250px;
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px dashed #334155;
            border-radius: 6px;
        }

        /* LA CAJA QUE CAMBIA (Inicia con valores por defecto) */
        #caja {
            width: 150px;
            height: 150px;
            background-color: #38bdf8;
            color: #121824;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>Laboratorio de Dimensiones y Colores</h1>

    <div class="panel">
        <!-- CONTROLES -->
        <div class="fila">
            <label>Unidad de medida:</label>
            <select id="unidad" onchange="actualizarCaja()">
                <option value="px">px (Píxeles)</option>
                <option value="%">% (Porcentaje)</option>
                <option value="rem">rem</option>
            </select>
        </div>

        <div class="fila">
            <label>Ancho y Alto (Valor):</label>
            <input type="number" id="medida" value="150" oninput="actualizarCaja()">
        </div>

        <div class="fila">
            <label>Formato de Color:</label>
            <select id="formato" onchange="actualizarCaja()">
                <option value="nombre">Nombre (Palabra)</option>
                <option value="hex">HEX (#)</option>
                <option value="rgb">RGB</option>
            </select>
        </div>

        <div class="fila">
            <label>Escribe el Color:</label>
            <input type="text" id="colorInput" value="skyblue" oninput="actualizarCaja()">
        </div>

        <!-- VISTA PREVIA EN TIEMPO REAL -->
        <div class="zona-previsualizacion">
            <div id="caja">Caja</div>
        </div>
    </div>

    <!-- JAVASCRIPT SIMPLIFICADO -->
    <script>
        function actualizarCaja() {
            // 1. Capturamos los elementos del HTML usando sus IDs
            const caja = document.getElementById('caja');
            const unidad = document.getElementById('unidad').value;
            const medida = document.getElementById('medida').value;
            const formato = document.getElementById('formato').value;
            const colorInput = document.getElementById('colorInput').value;

            // 2. Aplicamos el tamaño combinando el Número + la Unidad (Ej: "150" + "px")
            caja.style.width = medida + unidad;
            caja.style.height = medida + unidad;

            // 3. Aplicamos el color directamente
            caja.style.backgroundColor = colorInput;

            // 4. Mostramos el texto dentro de la caja para que el docente vea el cambio
            caja.innerText = medida + unidad;
        }
    </script>

</body>
</html>
