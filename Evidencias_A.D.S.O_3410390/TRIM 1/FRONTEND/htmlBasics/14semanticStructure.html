<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estructura semantica HTML5</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
          *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        main{
            width: 70%;
            header{
                border: 1px solid black;
                background-color: antiquewhite;
            }
            section{
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                border: 2px solid black;
                background-color: antiquewhite;
                width: 100%;
                margin: 1rem 0;
                border-radius: unset;
            }

            article{
                border: 1px solid #000;
                background-color: azure;
                width: 70%;
                min-height: 200px;
            }
            aside{
                border: 1px solid #000;
                background-color: azure;
                width: 30%;
                min-width: 100px;
            }
        
            footer{
                border: 2px solid black;
                background-color: antiquewhite;
            }
        }
        header, nav, aside, footer{
            font-size: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        section{
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>14. estructura semantica HTML5</h1>
        <p>Generacion de estructura moderna, utilizando las etiquetas de HTML5 para realizacion del maquetado</p>
    </header>
    <section>
        <!--Contenedor principal-->
        <main>
            <header>
                <h1>Titulo encabezado</h1>
                <nav>Menu navegacion</nav>
            </header>
            <section>
                <article>Contenido del article</article>
                <aside>Contenido aside</aside>
            </section>
            <footer>Contenido footer</footer>
        </main>
    </section>
</body>
</html>
