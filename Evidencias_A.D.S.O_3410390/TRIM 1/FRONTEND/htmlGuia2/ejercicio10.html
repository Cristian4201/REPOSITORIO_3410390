<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Estructura Semántica</title>

<style>

body{
    margin:0;
    font-family:Verdana, Geneva, Tahoma, sans-serif;
    background:#eef2f7;
    padding:20px;
}

.bloque{
    border-radius:10px;
    border:2px solid #444;
    margin:15px 0;
    padding:20px;
    color:#222;
    font-weight:bold;
}

header{
    background:#3b82f6;
    color:white;
}

nav{
    background:#93c5fd;
    color:black;
    margin-top:15px;
}

main{
    background:#f8fafc;
}

section{
    background:#bbf7d0;
}

article{
    background:#86efac;
}

aside{
    background:#fde68a;
}

footer{
    background:#374151;
    color:white;
    text-align:center;
}

</style>

</head>
<body>

<header class="bloque">
    Encabezado

    <nav class="bloque">
        Menú de navegación
    </nav>
</header>

<main class="bloque">

    <section class="bloque">
        Sección principal

        <article class="bloque">
            Artículo de contenido
        </article>

    </section>

    <aside class="bloque">
        Información adicional
    </aside>

</main>

<footer class="bloque">
    Pie de página
</footer>

</body>
</html>
