<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    font-family: 'Trebuchet MS', sans-serif;
    background-color: #f8f9fa;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px;
}

h2{
    color: #2c3e50;
    margin-bottom: 20px;
}

.contenedor-grid{
    width: 650px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    padding: 20px;
    border: 3px solid #34495e;
    border-radius: 10px;
    background-color: #ffffff;
}

.tarjeta{
    background: #81ecec;
    border: 2px solid #00b894;
    border-radius: 8px;
    text-align: center;
    padding: 35px 0;
    font-size: 20px;
    font-weight: bold;
    color: #2d3436;
    transition: 0.3s;
}

.tarjeta:hover{
    background-color: #55efc4;
    transform: scale(1.05);
}

</style>

</head>
<body>

<h2>Ejemplo de CSS Grid</h2>

<div class="contenedor-grid">
    <div class="tarjeta">Elemento A</div>
    <div class="tarjeta">Elemento B</div>
    <div class="tarjeta">Elemento C</div>
    <div class="tarjeta">Elemento D</div>
    <div class="tarjeta">Elemento E</div>
    <div class="tarjeta">Elemento F</div>
</div>

</body>
</html>
