<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Dancing+Script:wght@600&family=Poppins:wght@300;400;500&display=swap');

  :root{
    --bg:#0a0509;
    --bg2:#170810;
    --crimson:#ff2d55;
    --rose:#ff7fa0;
    --gold:#ffd27a;
    --ivory:#f7ece7;
  }

  *{ box-sizing:border-box; }

  html, body{
    margin:0; padding:0; height:100%;
    background:radial-gradient(120% 90% at 50% 20%, #1a0810 0%, var(--bg) 60%);
    overflow:hidden;
    font-family:'Poppins', sans-serif;
  }

  #heart-canvas{ position:fixed; inset:0; width:100%; height:100%; display:block; }

  .petals{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:1; }
  .petal{
    position:absolute; top:-8%;
    color:var(--rose);
    opacity:.5;
    animation:fall linear infinite;
    filter:drop-shadow(0 0 4px rgba(255,45,85,.5));
  }
  @keyframes fall{
    to{ transform:translateY(112vh) rotate(360deg); opacity:0; }
  }

  .overlay{
    position:fixed; inset:0; z-index:2;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    padding:5vh 6vw 8vh; text-align:center;
    pointer-events:none;
  }

  .titulo{
    font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:600;
    color:var(--ivory);
    font-size:clamp(1.3rem, 4.2vw, 2.5rem);
    opacity:0; transform:translateY(14px);
    transition:opacity 1.3s ease, transform 1.3s ease;
    text-shadow:0 0 20px rgba(255,45,85,.4);
    margin:0;
  }
  .titulo.show{ opacity:1; transform:translateY(0); }
  .titulo .accent{ font-family:'Dancing Script', cursive; color:var(--gold); font-size:1.25em; }

  .btn-carta{
    margin-top:1.5rem; padding:.85rem 2.2rem;
    border-radius:999px; border:1px solid rgba(255,127,160,.7);
    background:transparent; color:var(--rose);
    font-family:'Poppins', sans-serif; font-size:.82rem; letter-spacing:.08em;
    text-transform:uppercase;
    cursor:pointer;
    opacity:0; pointer-events:none;
    transition:opacity 1.1s ease .25s, background .25s ease, color .25s ease, box-shadow .25s ease;
  }
  .btn-carta.show{ opacity:1; pointer-events:auto; }
  .btn-carta:hover, .btn-carta:focus-visible{
    background:var(--rose); color:#1a0810; outline:none;
  }
  .btn-carta:focus-visible{ box-shadow:0 0 0 3px rgba(255,127,160,.45); }

  .carta{
    position:fixed; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    background:rgba(6,2,4,.9);
    opacity:0; pointer-events:none;
    transition:opacity .45s ease;
    padding:6vw;
  }
  .carta.show{ opacity:1; pointer-events:auto; }

  .carta-panel{
    position:relative;
    max-width:520px; width:100%;
    background:linear-gradient(165deg, var(--bg2), #050202);
    border:1px solid rgba(255,127,160,.3);
    border-radius:20px;
    padding:2.6rem 2.2rem 2.2rem;
    box-shadow:0 0 70px rgba(255,45,85,.18);
  }
  .carta-panel h2{
    font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:600;
    color:var(--gold); margin:0 0 1rem; font-size:1.6rem;
  }
  .carta-panel p{
    font-weight:300; line-height:1.85; font-size:.98rem; color:#efdfe1; margin:0 0 .9rem;
  }
  .carta-panel .firma{
    font-family:'Dancing Script', cursive; color:var(--rose); font-size:1.7rem; margin-top:1.1rem;
  }
  .cerrar{
    position:absolute; top:12px; right:16px;
    background:none; border:none; color:var(--ivory);
    font-size:1.6rem; line-height:1; cursor:pointer; padding:.3rem;
  }
  .cerrar:focus-visible{ outline:2px solid var(--rose); border-radius:6px; }

  @media (prefers-reduced-motion: reduce){
    .petal{ animation:none; display:none; }
    .titulo, .btn-carta, .carta{ transition:none; }
  }
</style>
</head>
<body>

<canvas id="heart-canvas"></canvas>
<div class="petals" id="petals"></div>

<div class="overlay">
  <p class="titulo" id="titulo">Para ti</p>
  <button class="btn-carta" id="btnCarta">Abrir mi carta</button>
</div>

<div class="carta" id="carta" role="dialog" aria-modal="true" aria-labelledby="cartaTitulo">
  <div class="carta-panel">
    <button class="cerrar" id="cerrarCarta" aria-label="Cerrar carta">&times;</button>
    <h2 id="cartaTitulo">Quiero que sepas...</h2>
    <p id="cartaTexto"></p>
    <p class="firma" id="cartaFirma"></p>
  </div>
</div>

<script>
/* =========================================================================
   PERSONALIZA AQUÍ — lo único que necesitas tocar para hacerlo tuyo
   ========================================================================= */
const NOMBRE = "hermosa";              // El nombre de tu novia
const TU_NOMBRE = "Cristian";          // Tu nombre, para la firma

// Palabras/frases que forman el corazón. Agrega apodos, fechas, lo que quieras.
const PALABRAS = [
  "te amo", "siempre", "mi amor", "contigo", "por ti",
  "para siempre", "tú y yo", "hermosa", "eres mi persona favorita", "gracias por existir"
];

// El texto de la carta que se abre al presionar el botón.
const MENSAJE_CARTA = `Quiero que sepas algo que pienso casi todos los días: contigo todo
se siente distinto, más tranquilo, más real. No necesito una fecha especial para
decírtelo — lo pienso en lo cotidiano, en las cosas simples. Gracias por dejarme
quererte así, sin apuros. Quiero seguir construyendo esto contigo, un día a la vez.`;
/* ========================================================================= */

document.getElementById('titulo').innerHTML = `Para ti, <span class="accent">${NOMBRE}</span>`;
document.getElementById('cartaTexto').textContent = MENSAJE_CARTA;
document.getElementById('cartaFirma').textContent = `— ${TU_NOMBRE}`;

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------------- Pétalos / corazones flotantes ---------------------- */
if(!reduceMotion){
  const petalsWrap = document.getElementById('petals');
  const symbols = ['❤','♥','❦'];
  const totalPetals = window.innerWidth < 600 ? 10 : 18;
  for(let i=0;i<totalPetals;i++){
    const el = document.createElement('span');
    el.className = 'petal';
    el.textContent = symbols[Math.floor(Math.random()*symbols.length)];
    el.style.left = (Math.random()*100) + 'vw';
    el.style.fontSize = (0.7 + Math.random()*1.1) + 'rem';
    el.style.animationDuration = (8 + Math.random()*10) + 's';
    el.style.animationDelay = (Math.random()*10) + 's';
    petalsWrap.appendChild(el);
  }
}

/* ------------------------- Corazón hecho de palabras ------------------------ */
const canvas = document.getElementById('heart-canvas');
const ctx = canvas.getContext('2d');
let DPR, centerX, centerY, scale;

function resizeCanvas(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = window.innerWidth * DPR;
  canvas.height = window.innerHeight * DPR;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  centerX = window.innerWidth / 2;
  centerY = window.innerHeight * 0.4;
  scale = Math.min(window.innerWidth, window.innerHeight) * 0.021;
}

function heartPoint(t, s){
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
  return { x: x*s, y: y*s };
}

function buildHeartPoints(){
  const pts = [];
  const outlineSteps = 90;
  for(let i=0;i<outlineSteps;i++){
    pts.push(heartPoint((i/outlineSteps)*Math.PI*2, 1));
  }
  const layers = 8;
  for(let L=1; L<=layers; L++){
    const s = 1 - L/9.2;
    const steps = Math.max(10, Math.floor(outlineSteps*s));
    for(let i=0;i<steps;i++){
      pts.push(heartPoint((i/steps)*Math.PI*2 + L*0.13, s));
    }
  }
  return pts;
}

const rawPoints = buildHeartPoints();
let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
rawPoints.forEach(p=>{
  if(p.x<minX) minX=p.x; if(p.x>maxX) maxX=p.x;
  if(p.y<minY) minY=p.y; if(p.y>maxY) maxY=p.y;
});
const midX = (minX+maxX)/2, midY = (minY+maxY)/2;

const particles = rawPoints.map(p => ({
  hx: p.x - midX,
  hy: p.y - midY,
  word: PALABRAS[Math.floor(Math.random()*PALABRAS.length)],
  phase: Math.random()*Math.PI*2,
  speed: 0.5 + Math.random()*0.7,
  sizeBase: 10 + Math.random()*6,
  mix: Math.random(),
  startAngle: Math.random()*Math.PI*2,
  startRadius: 0 // se calcula en resize/uso
}));

function assignStartPositions(){
  const maxDim = Math.max(window.innerWidth, window.innerHeight);
  particles.forEach(p=>{
    p.startRadius = maxDim * (0.55 + Math.random()*0.55);
  });
}

resizeCanvas();
assignStartPositions();
window.addEventListener('resize', () => { resizeCanvas(); });

function lerpColor(mix){
  // crimson -> gold
  const c1 = [255,45,85], c2 = [255,210,122];
  const r = Math.round(c1[0] + (c2[0]-c1[0])*mix);
  const g = Math.round(c1[1] + (c2[1]-c1[1])*mix);
  const b = Math.round(c1[2] + (c2[2]-c1[2])*mix);
  return [r,g,b];
}

const ASSEMBLE_MS = reduceMotion ? 1 : 2600;
let startTime = null;

function easeOutCubic(x){ return 1 - Math.pow(1-x, 3); }

function frame(ts){
  if(startTime === null) startTime = ts;
  const elapsed = ts - startTime;
  const elapsedSec = elapsed / 1000;
  const progress = Math.min(1, elapsed / ASSEMBLE_MS);
  const eased = easeOutCubic(progress);

  // Fondo con leve estela para dar brillo suave
  ctx.fillStyle = 'rgba(10,5,9,0.28)';
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

  particles.forEach(p=>{
    const targetX = centerX + p.hx*scale;
    const targetY = centerY + p.hy*scale;
    const startX = centerX + Math.cos(p.startAngle)*p.startRadius;
    const startY = centerY + Math.sin(p.startAngle)*p.startRadius;

    let x = startX + (targetX-startX)*eased;
    let y = startY + (targetY-startY)*eased;

    let fontSize = p.sizeBase * (0.5 + 0.5*eased);
    let alpha = 0.15 + 0.85*eased;

    if(progress >= 1 && !reduceMotion){
      const bob = Math.sin(elapsedSec*p.speed + p.phase) * 4;
      y += bob;
      fontSize = p.sizeBase + Math.sin(elapsedSec*p.speed + p.phase)*1.4;
      alpha = 0.7 + 0.3*Math.sin(elapsedSec*p.speed*0.6 + p.phase);
    }

    const [r,g,b] = lerpColor(p.mix);
    ctx.font = `${fontSize.toFixed(1)}px 'Poppins', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = `rgba(${r},${g},${b},${alpha.toFixed(2)})`;
    ctx.shadowColor = `rgba(${r},${g},${b},0.6)`;
    ctx.shadowBlur = 6;
    ctx.fillText(p.word, x, y);
  });
  ctx.shadowBlur = 0;

  if(progress < 1 || !reduceMotion){
    requestAnimationFrame(frame);
  }

  if(progress >= 1 && !window.__revealed){
    window.__revealed = true;
    setTimeout(()=>{
      document.getElementById('titulo').classList.add('show');
      document.getElementById('btnCarta').classList.add('show');
    }, 300);
  }
}
requestAnimationFrame(frame);

/* ------------------------------- Carta modal -------------------------------- */
const carta = document.getElementById('carta');
const btnCarta = document.getElementById('btnCarta');
const cerrarCarta = document.getElementById('cerrarCarta');

function abrirCarta(){ carta.classList.add('show'); cerrarCarta.focus(); }
function cerrarCartaFn(){ carta.classList.remove('show'); btnCarta.focus(); }

btnCarta.addEventListener('click', abrirCarta);
cerrarCarta.addEventListener('click', cerrarCartaFn);
carta.addEventListener('click', (e)=>{ if(e.target === carta) cerrarCartaFn(); });
window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape' && carta.classList.contains('show')) cerrarCartaFn(); });
</script>
</body>
</html>
